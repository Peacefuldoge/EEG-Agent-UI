[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-agent-ui"
version = "0.4.1"
description = "Optional Chainlit Web UI and Codex-style terminal chat for EEG-Agent Core"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["eeg-agent-core[agent]>=0.4.0,<0.5.0"]

[project.optional-dependencies]
web = ["chainlit>=2.0,<3"]
cli = ["rich>=13.7", "prompt-toolkit>=3.0"]
all = ["chainlit>=2.0,<3", "rich>=13.7", "prompt-toolkit>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
eeg-agent-chat = "eeg_agent_ui.chat_cli:main"
eeg-agent-web = "eeg_agent_ui.web_launcher:main"
eeg-agent-run = "eeg_agent_ui.batch_cli:main"

[tool.setuptools.packages.find]
include = ["eeg_agent_ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
